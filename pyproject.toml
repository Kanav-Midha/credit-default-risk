[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "End-to-end credit default risk modelling pipeline on the Home Credit dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kanav Midha", email = "kanavmidha9@gmail.com" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "scipy>=1.14",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9", "seaborn>=0.13", "shap>=0.46"]
tune = ["optuna>=4.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13", "pre-commit>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PD"]
ignore = [
    "B905",  # zip strict= not required on our supported versions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# `X` for a feature matrix and `y` for a target vector are universal in ML and
# match scikit-learn's own API; renaming them to satisfy PEP 8 would make this
# code read less like the ecosystem it sits in, not more.
"src/credit_risk/models/*" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that need the full dataset on disk",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
